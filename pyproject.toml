[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-layer"
version = "1.0.7"
description = "Zero-Knowledge Memory Layer for AI Agents — Cognitive Security Protocol with 4 proprietary seals. Giving Agents a Past. Giving Models a Soul."
readme = "README.md"
license = {text = "Apache 2.0"}
authors = [{name = "Ismael Marchi", email = "founder.synapselayer@proton.me"}]

keywords = [
  "ai-agents",
  "memory",
  "zero-knowledge",
  "encryption",
  "mcp",
  "agentic-ai",
  "lgpd",
  "cognitive-security",
  "differential-privacy",
  "neural-handover",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security :: Cryptography",
]

requires-python = ">=3.9"
dependencies = [
  "cryptography>=41.0.0",
  "pydantic>=2.0",
  "httpx>=0.24.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3.0",
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.7.0",
  "isort>=5.12.0",
  "mypy>=1.4.0",
  "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://synapselayer.org"
Repository = "https://github.com/SynapseLayer/synapse-layer"
Documentation = "https://synapselayer.org/docs"
Issues = "https://github.com/SynapseLayer/synapse-layer/issues"
Changelog = "https://github.com/SynapseLayer/synapse-layer/blob/main/CHANGELOG.md"
Security = "https://github.com/SynapseLayer/synapse-layer/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["synapse_memory", "synapse_memory.engine", "synapse_memory.crypto", "synapse_memory.autosave", "synapse_memory.plugins", "synapse_memory.integrations"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=synapse_memory --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
