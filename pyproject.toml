[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-layer"
version = "1.0.3"
description = "Zero-Knowledge Memory Layer for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache 2.0"}
authors = [
    {name = "Ismael Marchi", email = "founder.synapselayer@proton.me"}
]
keywords = ["ai", "agents", "memory", "zero-knowledge", "mcp", "encryption", "agentic-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://www.synapselayer.org"
Documentation = "https://www.synapselayer.org/docs"
Repository = "https://github.com/SynapseLayer/synapse-layer"
Issues = "https://github.com/SynapseLayer/synapse-layer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["synapse_layer"]
