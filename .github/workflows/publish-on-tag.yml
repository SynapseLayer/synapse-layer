name: NPM Publish on Tag

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Node info
        run: node -v && npm -v
      - name: Check published version and publish if missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk-typescript
          VERSION=$(node -p "require('./package.json').version")
          echo "Local package version: $VERSION"
          # try get published version; if command fails we assume not published
          PUBLISHED=$(npm view synapse-layer version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version $VERSION already published to npm — skipping publish."
            exit 0
          fi
          echo "Publishing $VERSION to npm..."
          npm ci
          npm run build || true
          npm publish --access public
