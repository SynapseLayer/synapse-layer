# Synapse Layer — Secret Scanning Guard
# Blocks push/PR if real sk_connect_ tokens or encryption keys are detected.
# Allows known placeholders: YOUR_TOKEN, sk_connect_xxx, sk_connect_test_, sk_connect_...

name: Secret Scan

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for real sk_connect_ tokens
        run: |
          echo "=== Scanning for real sk_connect_ tokens ==="
          # Find sk_connect_ followed by 16+ hex chars (real token pattern)
          # Exclude: placeholders, test tokens, documentation patterns
          MATCHES=$(
            grep -rn 'sk_connect_[a-f0-9]\{16,\}' \
              --include='*.py' --include='*.ts' --include='*.js' \
              --include='*.md' --include='*.yaml' --include='*.yml' \
              --include='*.json' --include='*.txt' --include='*.env' \
              --include='*.sh' --include='*.toml' \
              . 2>/dev/null \
            | grep -v '__pycache__' \
            | grep -v 'node_modules' \
            | grep -v '.git/' \
            | grep -v 'YOUR_TOKEN' \
            | grep -v 'sk_connect_test_' \
            | grep -v 'sk_connect_xxx' \
            | grep -v 'sk_connect_abc123' \
            | grep -v 'secret-scan.yml' \
            || true
          )

          if [ -n "$MATCHES" ]; then
            echo ""
            echo "❌ BLOCKED: Real sk_connect_ token(s) detected:"
            echo "$MATCHES"
            echo ""
            echo "Replace with: sk_connect_YOUR_TOKEN_HERE"
            echo "Or use: os.environ.get('SYNAPSE_TOKEN')"
            exit 1
          fi

          echo "✅ No real tokens found"

      - name: Scan for hardcoded encryption keys
        run: |
          echo "=== Scanning for hardcoded 64-char hex keys ==="
          # Match quoted 64-char hex strings that look like encryption keys
          # Exclude: test values, placeholders, known safe patterns
          MATCHES=$(
            grep -rn '"[a-f0-9]\{64\}"' \
              --include='*.py' --include='*.ts' --include='*.js' \
              --include='*.json' \
              . 2>/dev/null \
            | grep -v '__pycache__' \
            | grep -v 'node_modules' \
            | grep -v '.git/' \
            | grep -v 'YOUR_' \
            | grep -v 'test_' \
            | grep -v '0000000000' \
            | grep -v 'secret-scan.yml' \
            || true
          )

          if [ -n "$MATCHES" ]; then
            echo ""
            echo "⚠ WARNING: Potential hardcoded encryption key(s) detected:"
            echo "$MATCHES"
            echo ""
            echo "Use environment variables instead of hardcoded keys."
            echo "Example: os.environ.get('SYNAPSE_ENCRYPTION_KEY')"
            exit 1
          fi

          echo "✅ No hardcoded encryption keys found"

      - name: Summary
        if: success()
        run: echo "🟢 Secret scan passed — repository is clean"
