qualifiedName: "@synapselayer/synapse-protocol"
displayName: "Synapse Layer"
description: >
  Persistent memory infrastructure for AI agents — encrypted,
  governed, and cross-agent. The OAuth for AI Memory.
version: "2.4.0"
icon: "🧠"
sourceUrl: "https://github.com/SynapseLayer/synapse-layer"
homepage: "https://synapselayer.org"
license: "Apache-2.0"
author:
  name: "Ismael Marchi"
  url: "https://synapselayer.org"

serverUrl: "https://forge.synapselayer.org/api/mcp"
startCommand:
  type: "http"
  url: "https://forge.synapselayer.org/api/mcp"
  httpHeaders:
    x-connect-token: "{{config.connect_token}}"

configSchema:
  type: "object"
  required:
    - connect_token
  properties:
    connect_token:
      type: "string"
      title: "Synapse Connect Token"
      description: "Your Synapse Connect Token. Get it at synapselayer.org → Dashboard → Connect."
      x-from:
        header: "x-connect-token"
      x-to:
        header: "x-connect-token"
    agent_id:
      type: "string"
      title: "Agent ID"
      description: "Identifier for the agent using the memory layer. Defaults to 'default'."
      default: "default"

tools:
  - name: recall
    description: "Retrieve relevant persisted memory using semantic, temporal, priority, or hybrid routing."
    inputSchema:
      type: object
      required: [query, reason]
      properties:
        query:
          type: string
          description: "What to recall — natural language query for memory retrieval."
        reason:
          type: string
          description: "Human-readable justification for the recall request (10–200 chars)."
        scope:
          type: string
          description: "Memory scope. 'agent' (default) limits to current agent, 'tenant' searches across all agents."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped recall. Defaults to 'default'."
        limit:
          type: number
          description: "Maximum memories to return (1–50, default: 10)."
        mode:
          type: string
          description: "Recall routing mode."
          enum: [auto, temporal, semantic, priority, hybrid]

  - name: save_to_synapse
    description: "Persist memory with encryption at rest, sanitization, and deduplication controls."
    inputSchema:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "The memory content to store securely."
        agent_id:
          type: string
          description: "Agent identifier for memory isolation. Defaults to 'default'."
        project:
          type: string
          description: "Project identifier (e.g., SYNAPSE_LAYER)."
        type:
          type: string
          description: "Event type: MILESTONE, DECISION, ALERT, AUTO-STRAT, AUTO-OP, AUTO-INSIGHT."
        importance:
          type: number
          description: "Importance level 1–5 (default: 3)."
        tags:
          type: array
          description: "Tags for categorization."
          items:
            type: string

  - name: process_text
    description: "Extract candidate memories from free-form text with governance filters and sanitization."
    inputSchema:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: "Free-form text to scan for auto-save triggers."
        agent_id:
          type: string
          description: "Agent identifier. Defaults to 'default'."
        project:
          type: string
          description: "Project identifier. Auto-detected if omitted."
        source:
          type: string
          description: "Source identifier (default: mcp)."

  - name: search
    description: "Search persisted memory across agent scopes using full-text matching."
    inputSchema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: "Search query — natural language or keywords."
        scope:
          type: string
          description: "Search scope. 'agent' (default) or 'tenant' for cross-agent search."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped search."
        limit:
          type: number
          description: "Maximum results to return (1–50, default: 20)."

  - name: health_check
    description: "Check service availability, engine version, and storage health. Public method."
    inputSchema:
      type: object
      properties: {}

  - name: initialize_context
    description: "Initialize a persistent memory context for a conversation or agent session."
    inputSchema:
      type: object
      properties: {}

  - name: save_memory
    description: "Save a memory entry to the persistent store. Alias of save_to_synapse."
    inputSchema:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "The memory content to store securely."
        agent_id:
          type: string
          description: "Agent identifier for memory isolation."
        tags:
          type: array
          description: "Tags for categorization."
          items:
            type: string

  - name: store_memory
    description: "Store structured memory with metadata and trust scoring."
    inputSchema:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "The memory content to store securely."
        agent_id:
          type: string
          description: "Agent identifier. Defaults to 'default'."
        tags:
          type: array
          description: "Tags for categorization."
          items:
            type: string

  - name: recall_memory
    description: "Recall persisted memory by query. Alias of recall."
    inputSchema:
      type: object
      required: [query, reason]
      properties:
        query:
          type: string
          description: "What to recall — natural language query."
        reason:
          type: string
          description: "Justification for the recall request (10–200 chars)."
        scope:
          type: string
          description: "Memory scope: 'agent' (default) or 'tenant'."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped recall."
        limit:
          type: number
          description: "Maximum memories to return (1–50, default: 10)."
        mode:
          type: string
          description: "Recall routing mode."
          enum: [auto, temporal, semantic, priority, hybrid]

  - name: list_memories
    description: "List memory metadata with pagination and governance limits."
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          description: "Memory scope: 'agent' (default) or 'tenant'."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped listing."
        limit:
          type: number
          description: "Maximum rows to return (default: 5, max: 10)."

  - name: memory_feedback
    description: "Submit feedback to adjust trust scoring for stored memories."
    inputSchema:
      type: object
      required: [memoryId, signal]
      properties:
        memoryId:
          type: string
          description: "ID of the memory to provide feedback on."
        signal:
          type: string
          description: "Feedback signal."
          enum: [used, ignored, helpful, irrelevant]
        sessionId:
          type: string
          description: "Optional session identifier for tracking."

  - name: neural_handover
    description: "Transfer contextual state between agents with continuity controls."
    inputSchema:
      type: object
      required: [token, reason]
      properties:
        token:
          type: string
          description: "Handover token (64 hex chars). Generated in Forge UI or API."
        reason:
          type: string
          description: "Justification for consuming this handover (10–200 chars)."
        consuming_agent:
          type: string
          description: "Agent identifier consuming the handover."

  - name: slo_report
    description: "Return uptime and SLO metrics for the MCP service."
    inputSchema:
      type: object
      required: [admin_token]
      properties:
        admin_token:
          type: string
          description: "Admin authentication token."
        window_hours:
          type: array
          description: "Time windows in hours (default: [24, 168])."
          items:
            type: number

tags:
  - agent-memory
  - persistent-context
  - long-term-memory
  - mcp-memory
  - aes-256-gcm
  - mcp
  - ai-agents
  - langchain
  - crewai
  - llm
  - typescript
  - autogen
  - llamaindex
  - semantic-kernel
  - privacy
  - encryption
  - cross-agent
  - state-continuity
