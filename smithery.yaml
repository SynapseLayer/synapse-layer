qualifiedName: "@synapselayer/synapse-protocol"
displayName: "Synapse Layer"
description: >
  Persistent memory infrastructure for AI agents — encrypted,
  governed, and cross-agent. The OAuth for AI Memory.
version: "2.4.6"
icon: "🧠"
sourceUrl: "https://github.com/SynapseLayer/synapse-layer"
homepage: "https://synapselayer.org"
license: "Apache-2.0"
author:
  name: "Ismael Marchi"
  url: "https://synapselayer.org"

serverUrl: "https://forge.synapselayer.org/api/mcp"
startCommand:
  type: "http"
  url: "https://forge.synapselayer.org/api/mcp"
  httpHeaders:
    x-connect-token: "{{config.connect_token}}"

configSchema:
  type: "object"
  required:
    - connect_token
  properties:
    connect_token:
      type: "string"
      title: "Synapse Connect Token"
      description: "Your Synapse Connect Token from forge.synapselayer.org"
    agent_id:
      type: "string"
      title: "Agent ID"
      description: "Optional agent identifier"
      default: "default"

tools:
  - name: recall
    description: "Retrieve relevant persisted memory using semantic, temporal, priority, or hybrid routing."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      required: [query, reason]
      properties:
        query:
          type: string
          description: "What to recall — natural language query for memory retrieval."
        reason:
          type: string
          description: "Human-readable justification for the recall request (10–200 chars)."
        scope:
          type: string
          description: "Memory scope. 'agent' (default) limits to current agent, 'tenant' searches across all agents."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped recall. Defaults to 'default'."
        limit:
          type: number
          description: "Maximum memories to return (1–50, default: 10)."
        mode:
          type: string
          description: "Recall routing mode."
          enum: [auto, temporal, semantic, priority, hybrid]
    outputSchema:
      type: object
      properties:
        memories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              content:
                type: string
              trust_quotient:
                type: number
              intent:
                type: string
              is_critical:
                type: boolean
              agent:
                type: string
              timestamp:
                type: string
                format: date-time
              memory_type:
                type: string
              hybridScore:
                type: number
              confidence:
                type: string
                enum: [high, medium_fts, low]
        count:
          type: integer
        query:
          type: string
        scope:
          type: string
        agent_id:
          type: string
        scope_source:
          type: string
        recall_mode:
          type: string
        fallback:
          type: boolean
        redacted:
          type: boolean
        recallLatencyMs:
          type: number
        sessionCacheHit:
          type: boolean
        queryCacheHit:
          type: boolean
      required: [memories, count, query]

  - name: save_to_synapse
    description: "Persist memory with encryption at rest, sanitization, and deduplication controls."
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "The memory content to store securely."
        agent_id:
          type: string
          description: "Agent identifier for memory isolation. Defaults to 'default'."
        project:
          type: string
          description: "Project identifier (e.g., SYNAPSE_LAYER)."
        type:
          type: string
          description: "Event type: MILESTONE, DECISION, ALERT, AUTO-STRAT, AUTO-OP, AUTO-INSIGHT."
        importance:
          type: number
          description: "Importance level 1–5 (default: 3)."
        tags:
          type: array
          description: "Tags for categorization."
          items:
            type: string
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [saved, error]
        memory_id:
          type: string
          format: uuid
        trust_quotient:
          type: number
          minimum: 0
          maximum: 1
        intent:
          type: string
        sanitized:
          type: boolean
        privacy_applied:
          type: boolean
        pipeline:
          type: object
          properties:
            pii_redaction:
              type: boolean
            intent_validation:
              type: boolean
            differential_privacy:
              type: boolean
            encryption:
              type: boolean
        quota:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
        timestamp:
          type: string
          format: date-time
      required: [status, memory_id, timestamp]

  - name: process_text
    description: "Extract candidate memories from free-form text with governance filters and sanitization."
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: "Free-form text to scan for auto-save triggers."
        agent_id:
          type: string
          description: "Agent identifier. Defaults to 'default'."
        project:
          type: string
          description: "Project identifier. Auto-detected if omitted."
        source:
          type: string
          description: "Source identifier (default: mcp)."
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [processed, error]
        events_detected:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              memory_id:
                type: string
              trust_quotient:
                type: number
        pipeline:
          type: object
          properties:
            trigger_detection:
              type: boolean
            policy_evaluation:
              type: boolean
            pii_redaction:
              type: boolean
            deduplication:
              type: boolean
        timestamp:
          type: string
          format: date-time
      required: [status, events_detected, results]

  - name: search
    description: "Search persisted memory across agent scopes using full-text matching."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: "Search query — natural language or keywords."
        scope:
          type: string
          description: "Search scope. 'agent' (default) or 'tenant' for cross-agent search."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped search."
        limit:
          type: number
          description: "Maximum results to return (1–50, default: 20)."
    outputSchema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              trust_quotient:
                type: number
              intent:
                type: string
              is_critical:
                type: boolean
              agent:
                type: string
              timestamp:
                type: string
                format: date-time
              memory_type:
                type: string
        count:
          type: integer
        query:
          type: string
        scope:
          type: string
        agent_id:
          type: string
        scope_source:
          type: string
      required: [results, count, query]

  - name: health_check
    description: "Check service availability, engine version, and storage health. Public method."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      properties: {}
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        engine:
          type: string
        database:
          type: string
        latencyMs:
          type: number
        dbRealLatencyMs:
          type: number
        cacheHit:
          type: boolean
        capabilities:
          type: object
        timestamp:
          type: string
          format: date-time
      required: [status, version, timestamp]

  - name: initialize_context
    description: "Initialize a persistent memory context for a conversation or agent session."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      properties: {}
    outputSchema:
      type: object
      properties:
        initialized:
          type: boolean
        count:
          type: integer
        memories:
          type: array
          items:
            type: object
        scope:
          type: string
        query:
          type: string
        error:
          type: string
      required: [initialized, count, memories]

  - name: save_memory
    description: "Save a memory entry to the persistent store. Alias of save_to_synapse."
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "The memory content to store securely."
        agent_id:
          type: string
          description: "Agent identifier for memory isolation."
        tags:
          type: array
          description: "Tags for categorization."
          items:
            type: string
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [saved, error]
        memory_id:
          type: string
          format: uuid
        trust_quotient:
          type: number
          minimum: 0
          maximum: 1
        intent:
          type: string
        sanitized:
          type: boolean
        privacy_applied:
          type: boolean
        pipeline:
          type: object
        quota:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
        timestamp:
          type: string
          format: date-time
      required: [status, memory_id, timestamp]

  - name: store_memory
    description: "Store structured memory with metadata and trust scoring."
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "The memory content to store securely."
        agent_id:
          type: string
          description: "Agent identifier. Defaults to 'default'."
        tags:
          type: array
          description: "Tags for categorization."
          items:
            type: string
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum: [saved, error]
        memory_id:
          type: string
          format: uuid
        trust_quotient:
          type: number
          minimum: 0
          maximum: 1
        intent:
          type: string
        sanitized:
          type: boolean
        privacy_applied:
          type: boolean
        pipeline:
          type: object
        quota:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
        timestamp:
          type: string
          format: date-time
      required: [status, memory_id, timestamp]

  - name: recall_memory
    description: "Recall persisted memory by query. Alias of recall."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      required: [query, reason]
      properties:
        query:
          type: string
          description: "What to recall — natural language query."
        reason:
          type: string
          description: "Justification for the recall request (10–200 chars)."
        scope:
          type: string
          description: "Memory scope: 'agent' (default) or 'tenant'."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped recall."
        limit:
          type: number
          description: "Maximum memories to return (1–50, default: 10)."
        mode:
          type: string
          description: "Recall routing mode."
          enum: [auto, temporal, semantic, priority, hybrid]
    outputSchema:
      type: object
      properties:
        memories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              content:
                type: string
              trust_quotient:
                type: number
              intent:
                type: string
              is_critical:
                type: boolean
              agent:
                type: string
              timestamp:
                type: string
                format: date-time
              memory_type:
                type: string
              hybridScore:
                type: number
              confidence:
                type: string
                enum: [high, medium_fts, low]
        count:
          type: integer
        query:
          type: string
        scope:
          type: string
        agent_id:
          type: string
        scope_source:
          type: string
        recall_mode:
          type: string
        fallback:
          type: boolean
        redacted:
          type: boolean
        recallLatencyMs:
          type: number
        sessionCacheHit:
          type: boolean
        queryCacheHit:
          type: boolean
      required: [memories, count, query]

  - name: list_memories
    description: "List memory metadata with pagination and governance limits."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          description: "Memory scope: 'agent' (default) or 'tenant'."
          enum: [agent, tenant]
        agent_id:
          type: string
          description: "Agent identifier for scoped listing."
        limit:
          type: number
          description: "Maximum rows to return (default: 5, max: 10)."
    outputSchema:
      type: object
      properties:
        memories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              createdAt:
                type: string
                format: date-time
              tags:
                type: array
                items:
                  type: string
              summary:
                type: string
              tqScore:
                type: number
              confidence:
                type: number
        count:
          type: integer
        scope:
          type: string
        agent_id:
          type: string
        scope_source:
          type: string
        limit_applied:
          type: integer
        redacted:
          type: boolean
      required: [memories, count]

  - name: memory_feedback
    description: "Submit feedback to adjust trust scoring for stored memories."
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [memoryId, signal]
      properties:
        memoryId:
          type: string
          description: "ID of the memory to provide feedback on."
        signal:
          type: string
          description: "Feedback signal."
          enum: [used, ignored, helpful, irrelevant]
        sessionId:
          type: string
          description: "Optional session identifier for tracking."
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        memoryId:
          type: string
        signal:
          type: string
      required: [success, memoryId, signal]

  - name: neural_handover
    description: "Transfer contextual state between agents with continuity controls."
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [token, reason]
      properties:
        token:
          type: string
          description: "Handover token (64 hex chars). Generated in Forge UI or API."
        reason:
          type: string
          description: "Justification for consuming this handover (10–200 chars)."
        consuming_agent:
          type: string
          description: "Agent identifier consuming the handover."
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        handoverId:
          type: string
        fromAgent:
          type: string
        memoryCount:
          type: integer
        memories:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              agent:
                type: string
              trust_quotient:
                type: number
              category:
                type: string
      required: [success, handoverId, memoryCount]

  - name: slo_report
    description: "Return uptime and SLO metrics for the MCP service."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      required: [admin_token]
      properties:
        admin_token:
          type: string
          description: "Admin authentication token."
        window_hours:
          type: array
          description: "Time windows in hours (default: [24, 168])."
          items:
            type: number
    outputSchema:
      type: object
      properties:
        version:
          type: string
        windows:
          type: array
          items:
            type: object
        timestamp:
          type: string
          format: date-time

tags:
  - agent-memory
  - persistent-context
  - long-term-memory
  - mcp-memory
  - aes-256-gcm
  - mcp
  - ai-agents
  - langchain
  - crewai
  - llm
  - typescript
  - autogen
  - llamaindex
  - semantic-kernel
  - privacy
  - encryption
  - cross-agent
  - state-continuity
